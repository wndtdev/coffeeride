version: "3.8"

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: cofferide-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: cofferide
      POSTGRES_USER: cofferide
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data:
